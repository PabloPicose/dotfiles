# hyprpaper 0.8 — fondo de pantalla por monitor
# Cambiar en caliente sin reiniciar: editar y `pkill hyprpaper && hyprpaper &`
# fit_mode: cover | contain | tile | fill

splash = false

wallpaper {
    monitor = DP-1
    path = /usr/share/wallpapers/cachyos-wallpapers/CachyOS_Moon.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-2
    path = /usr/share/wallpapers/cachyos-wallpapers/CachyOS_Moon.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-3
    path = /usr/share/wallpapers/cachyos-wallpapers/CachyOS_Moon.jpg
    fit_mode = cover
}
