# hyprlock — pantalla de bloqueo (Catppuccin Macchiato + azul de kitty)
# Bloquear: Hyper+Esc, menú de energía (SUPER+Esc) o tras 10 min sin usar el PC.

$font = MesloLGM Nerd Font Propo
$accent = rgb(7a9ec4)
$text = rgb(cad3f5)
$surface = rgba(36, 58, 79, 0.6)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Captura de la pantalla, difuminada y oscurecida
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Hora
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $text
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    font_size = 22
    font_family = $font
    color = $text
    position = 0, 70
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    inner_color = $surface
    outer_color = $accent
    check_color = rgb(a6da95)
    fail_color = rgb(ed8796)
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 8
    placeholder_text = Contraseña
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

# Distribución de teclado activa (clic para cambiar)
label {
    monitor =
    text = 󰌌 $LAYOUT[us,es]
    font_size = 14
    font_family = $font
    color = $text
    onclick = hyprctl switchxkblayout all next
    position = 0, -110
    halign = center
    valign = center
}
