# hypridle — qué hacer cuando no se usa el PC (arranca desde hyprland.lua, NO como servicio
# de systemd: graphical-session.target también existe en KDE y arrancaría allí).
# Los juegos a pantalla completa y los vídeos de Firefox impiden que salte.

general {
    lock_cmd = pidof hyprlock || hyprlock                              # no abrir dos bloqueos
    before_sleep_cmd = loginctl lock-session                           # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # encender pantallas al volver
}

# 10 min → bloquear
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min → apagar pantallas (se encienden al mover el ratón o pulsar una tecla)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Sin suspensión automática (sobremesa: descargas, compilaciones…).
# Para activarla: listener { timeout = 3600  on-timeout = systemctl suspend }
