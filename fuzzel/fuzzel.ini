# fuzzel — lanzador de apps (SUPER+Espacio)
# Catppuccin Macchiato + azul de kitty (#7A9EC4). Teclas estilo vim: CTRL+j/k.
# Opciones: man fuzzel.ini

[main]
font=MesloLGM Nerd Font Propo:size=13
icon-theme=breeze-dark
terminal=kitty -e {cmd}
prompt="❯ "
placeholder=Buscar app...
match-mode=fzf
lines=12
width=45
horizontal-pad=20
vertical-pad=12
inner-pad=8
show-actions=yes

[colors]
background=24273af2
text=cad3f5ff
prompt=7a9ec4ff
placeholder=8087a2ff
input=cad3f5ff
match=7a9ec4ff
selection=494d64ff
selection-text=cad3f5ff
selection-match=8aadf4ff
counter=8087a2ff
border=7a9ec4ff

[border]
width=2
radius=8

[key-bindings]
# CTRL+k borraba hasta el final de la línea; se libera para "subir"
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
cancel=Escape Control+g Control+c Control+bracketleft
