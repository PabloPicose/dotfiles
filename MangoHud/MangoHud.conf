# MangoHud — FPS, temperaturas y uso en los juegos (Hyprland y KDE)
# Activarlo en un juego de Steam: Propiedades → Opciones de lanzamiento:
#     gamemoderun mangohud %command%
# Mostrar/ocultar dentro del juego: Meh+M (Meh = Ctrl+Shift+Alt, una tecla en el Moonlander)
# Opciones: /usr/share/doc/mangohud/MangoHud.conf.example

toggle_hud=Control_L+Shift_L+Alt_L+m

# Qué mostrar
fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
vram
ram
gamemode

# Aspecto (Catppuccin Macchiato)
position=top-left
hud_compact
font_size=20
round_corners=8
background_alpha=0.6
background_color=24273A
text_color=CAD3F5
gpu_color=A6DA95
cpu_color=7A9EC4
